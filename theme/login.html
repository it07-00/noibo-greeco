  <body>
    <div class="page-layout">
      <div
        class="auth-wrapper min-vh-100 px-2"
        style="
          background-image: url(images/auth/auth.webp);
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
        "
      >
        <div class="row g-0 min-vh-100">
          <div class="col-xl-5 col-lg-6 ms-auto px-sm-4 align-self-center py-4">
            <div
              class="card card-body p-4 p-sm-5 maxw-450px m-auto rounded-4 auth-card"
              data-simplebar
            >
              <div class="mb-4 text-center">
                <a href="index.html" aria-label="GREECO logo">
                  <img
                    class="visible-light"
                    src="images/logo-full.svg"
                    alt="GREECO logo"
                  />
                  <img
                    class="visible-dark"
                    src="images/logo-full-white.svg"
                    alt="GREECO logo"
                  />
                </a>
              </div>
              <div class="text-center mb-4">
                <h5 class="mb-1">Welcome to GREECO</h5>
                <p>Sign in to access your secure admin dashboard.</p>
              </div>
              <form action="index.html">
                <div class="mb-4">
                  <label class="form-label" for="loginEmail"
                    >Email Address</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="loginEmail"
                    placeholder="info@example.com"
                  />
                </div>
                <div class="mb-4">
                  <label class="form-label" for="loginPassword">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="loginPassword"
                    placeholder="********"
                  />
                </div>
                <div class="mb-4">
                  <div class="d-flex justify-content-between">
                    <div class="form-check mb-0">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe"
                      />
                      <label class="form-check-label" for="rememberMe">
                        Remember Me
                      </label>
                    </div>
                    <a href="authentication/forgot-password-basic.html"
                      >Forgot Password?</a
                    >
                  </div>
                </div>
                <div class="mb-3">
                  <button
                    type="submit"
                    value="Submit"
                    class="btn btn-primary waves-effect waves-light w-100"
                  >
                    Login
                  </button>
                </div>
                <p class="mb-5 text-center">
                  Don’t have an account?
                  <a href="authentication/register-basic.html">Sign Up here</a>
                </p>
                <div class="border-bottom position-relative my-3 text-center">
                  <span
                    class="px-3 position-absolute translate-middle top-50 start-50 bg-body"
                    >Or Continue With</span
                  >
                </div>
                <div class="d-flex gap-2 justify-content-center mt-5">
                  <a
                    href="javascript:void(0);"
                    class="btn btn-icon btn-subtle-facebook rounded-circle waves-effect waves-light"
                  >
                    <i class="fa-brands fa-facebook-f"></i>
                  </a>
                  <a
                    href="javascript:void(0);"
                    class="btn btn-icon btn-subtle-twitter rounded-circle waves-effect waves-light"
                  >
                    <i class="fa-brands fa-x-twitter"></i>
                  </a>
                  <a
                    href="javascript:void(0);"
                    class="btn btn-icon btn-subtle-github rounded-circle waves-effect waves-light"
                  >
                    <i class="fa-brands fa-github"></i>
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
